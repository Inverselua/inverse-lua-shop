<style>
  /* Nova.gg — charcoal (#27272B) canvas, periwinkle (#ABBDFF) accent taken from the logo.
     Rounded Nunito echoes the bubbly NOVA letterforms. */
  :root {
    --bg: #27272b;              /* charcoal, from your swatch */
    --surface: #303035;
    --surface-2: #38383e;
    --line: #46464d;
    --ink: #eeeef2;
    --ink-soft: #a3a3ad;
    --accent: #abbdff;          /* logo color */
    --accent-strong: #abbdff;
    --accent-tint: #363a52;
    --accent-ink: #1b2350;      /* text sitting on the accent */
    --good: #4fd98a;
    --bad: #ff7a7a;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.28);
    --display: "Nunito", ui-rounded, system-ui, sans-serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55; font-size: 15px; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .mono { font-family: var(--mono); }
  .wrap { width: 100%; max-width: 1600px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

  /* ---- Header: status left, NOVA wordmark top-right ---- */
  header.nav { padding-top: env(safe-area-inset-top, 0px); }
  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 600; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
  .wordmark { height: 40px; width: auto; display: block; }

  /* ---- Product ---- */
  .product { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-block: 8px 16px; align-items: stretch; }
  @media (max-width: 780px) { .product { grid-template-columns: 1fr; } }

  .cover { position: relative; min-height: 420px; max-width: 100%; border-radius: 24px; overflow: hidden;
    background:
      radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--accent) 55%, var(--surface)) 0%, transparent 60%),
      radial-gradient(90% 80% at 80% 90%, color-mix(in srgb, var(--accent) 30%, var(--surface)) 0%, transparent 65%),
      var(--surface-2);
    border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; }
  .cover img { width: min(58%, 380px); height: auto; filter: drop-shadow(0 16px 30px rgba(0,0,0,.35)); }
  @media (max-width: 780px) { .cover { aspect-ratio: 1 / 1; min-height: 0; } .cover.photo { aspect-ratio: 16 / 10; } .cover.photo.square { aspect-ratio: 1 / 1; } }
  .cover.ui img { width: 92%; max-width: 92%; filter: drop-shadow(0 18px 34px rgba(0,0,0,.55)); }
  .cover .cover-bg { display: none; }
  .cover.photo .cover-bg { display: block; position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px);
    object-fit: cover; filter: blur(28px) brightness(.95) saturate(1.3); }
  .cover.photo #coverImg { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 18px 40px rgba(0,0,0,.5)); }
  .cover.photo .tag { z-index: 1; }

  /* ---- Product menu ---- */
  .menu { display: flex; gap: 6px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 12px; }
  .menu button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; font-family: var(--display);
    font-weight: 800; font-size: .95rem; color: var(--ink-soft); white-space: nowrap; transition: background .14s, color .14s; }
  .menu button:hover { color: var(--ink); background: var(--surface-2); }
  .menu button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .menu .thumb { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
  .menu .so { font-size: .78rem; font-weight: 700; opacity: .75; }
  @media (max-width: 520px) {
    .menu { width: 100%; gap: 4px; }
    .menu button { flex: 1 1 0; justify-content: center; padding: 8px 6px; font-size: .82rem; white-space: normal; text-align: center; line-height: 1.15; }
    .menu .thumb, .menu .so { display: none; }
  }
  .cover .tag { position: absolute; left: 16px; bottom: 16px; font-family: var(--mono); font-size: .7rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); padding: 5px 9px; border-radius: 8px; }

  .info { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); }
  @media (max-width: 480px) { .info { padding: 20px; } }
  .eyebrow { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-strong); }
  .info h1 { font-size: clamp(2.2rem, 6vw, 2.9rem); font-weight: 900; letter-spacing: -.01em; margin-top: 6px; line-height: 1.05; }
  .blurb { color: var(--ink-soft); margin: 10px 0 0; max-width: 44ch; }
  .feat { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 7px; font-size: .9rem; }
  .feat li { display: flex; align-items: center; gap: 9px; }
  .feat .ck { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-strong); display: grid; place-items: center; flex: none; }

  .opts-label { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin: 24px 0 10px; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1.5px solid var(--line);
    border-radius: 14px; padding: 13px 15px; background: var(--surface-2); transition: border-color .14s, background .14s; }
  .opt:hover { border-color: color-mix(in srgb, var(--accent-strong) 50%, var(--line)); }
  .opt[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--accent-tint); }
  .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; background: var(--surface); }
  .opt[aria-pressed="true"] .radio { border-color: var(--accent-strong); }
  .opt[aria-pressed="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-strong); }
  .o-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .o-dur { font-family: var(--display); font-weight: 800; font-size: 1.05rem; }
  .o-sub { font-size: .8rem; color: var(--ink-soft); }
  .o-badge { font-family: var(--mono); font-size: .6rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    background: var(--accent); color: var(--accent-ink); padding: 3px 7px; border-radius: 6px; }
  .o-price { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }

  .btn-primary { width: 100%; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 800;
    font-size: 1.05rem; padding: 15px; border-radius: 14px; transition: filter .14s, transform .14s;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent); }
  .btn-primary:hover { filter: brightness(1.04); transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--surface-2); color: var(--ink-soft); box-shadow: none; transform: none; cursor: not-allowed; border: 1px solid var(--line); }
  .btn-ghost { width: 100%; background: var(--surface-2); color: var(--ink); font-weight: 700; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--line); }
  .buy-row { margin-top: 18px; display: grid; gap: 10px; }
  .pay-strip { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; color: var(--ink-soft); font-size: .76rem; }
  .chips { display: flex; gap: 5px; }
  .chips span { width: 30px; height: 20px; border-radius: 4px; display: grid; place-items: center; }

  /* ---- Trust band ---- */
  .trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-bottom: 24px; }
  @media (max-width: 700px) { .trust { grid-template-columns: 1fr; } }
  .trust .t { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .trust .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-tint); color: var(--accent-strong); display: grid; place-items: center; flex: none; }
  .trust b { font-family: var(--display); font-weight: 800; display: block; }
  .trust span { font-size: .84rem; color: var(--ink-soft); }

  footer.site { border-top: 1px solid var(--line); padding-block: 22px calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--ink-soft); font-size: .82rem; }
  footer.site .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* ---- Modal ---- */
  .modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; opacity: 0; pointer-events: none;
    transition: opacity .2s; background: rgba(20,22,30,.45); backdrop-filter: blur(4px); }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 460px;
    max-height: calc(100dvh - 32px); overflow-y: auto; box-shadow: var(--shadow); transform: translateY(10px) scale(.98); transition: transform .2s; }
  .modal.open .modal-card { transform: none; }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .modal-head h2 { font-size: 1.2rem; font-weight: 800; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-soft); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .modal-body { padding: 18px 20px 22px; }
  .field { margin-bottom: 14px; }
  .field label, .pay-label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: 6px; color: var(--ink-soft); }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--ink); font-size: .95rem; outline: none; font-family: var(--body); }
  .field input:focus { border-color: var(--accent-strong); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .field input.err { border-color: var(--bad); }
  .pays { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .pay { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: .76rem; font-weight: 700; color: var(--ink-soft); background: var(--surface-2); }
  .pay:hover { color: var(--ink); }
  .pay[aria-pressed="true"] { border-color: var(--accent-strong); color: var(--ink); background: var(--accent-tint); }
  .pay-note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; font-size: .82rem;
    color: var(--ink-soft); margin-bottom: 16px; display: flex; gap: 9px; align-items: flex-start; line-height: 1.45; }
  .pay-note svg { flex: none; margin-top: 1px; color: var(--accent-strong); }
  .sum-line { display: flex; justify-content: space-between; font-size: .92rem; padding: 4px 0; }
  .sum-line.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-weight: 800; font-size: 1.05rem; }
  .sum-line .mono { font-variant-numeric: tabular-nums; }
  .fine { font-size: .74rem; color: var(--ink-soft); text-align: center; margin: 12px 0 0; }

  .receipt-top { text-align: center; padding: 6px 0 16px; }
  .checkmark { width: 58px; height: 58px; border-radius: 50%; background: var(--accent-tint); color: var(--accent-strong); display: grid; place-items: center; margin: 0 auto 12px; }
  .receipt-top h2 { font-size: 1.4rem; font-weight: 900; }
  .receipt-top p { color: var(--ink-soft); font-size: .9rem; margin: 6px 0 0; }
  .key-item { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: var(--surface-2); }
  .ki-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; }
  .ki-title { font-family: var(--display); font-weight: 800; }
  .ki-plat { font-family: var(--mono); font-size: .68rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
  .keycode { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px dashed var(--accent-strong); border-radius: 10px; padding: 10px 12px; }
  .keycode code { flex: 1; min-width: 0; font-family: var(--mono); font-weight: 700; font-size: .92rem; overflow-x: auto; white-space: nowrap; color: var(--ink); }
  .copy-key { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .copy-key.done { background: var(--good); color: #fff; }
  .redeem { font-size: .76rem; color: var(--ink-soft); margin-top: 8px; }

  .processing { text-align: center; padding: 36px 16px; }
  .spinner { width: 44px; height: 44px; border: 3px solid var(--line); border-top-color: var(--accent-strong); border-radius: 50%; margin: 0 auto 16px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing p { color: var(--ink-soft); margin: 0; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } .btn-primary:hover { transform: none; } }
</style>

    soon: true,
    eyebrow: 'Coming soon', noun: 'key', optsLabel: 'Coming soon',
    blurb: 'A new Project Delta script from Nova. Coming soon — check back here for launch.',
    feat: ['Coming soon to the Nova store', 'Instant key delivery at launch', 'Pay by card or Cash App'],
    redeem: '',
    def: 'sigma-soon',
    options: [
      { id:'sigma-soon', dur:'SigmaHack', sub:'Project Delta script — coming soon', price:0 },
    ],
  },
};
const PAYMENTS = [
  { id:'stripe', name:'Card' }, { id:'cashapp', name:'Cash App' }, { id:'paypal', name:'PayPal' },
  { id:'venmo', name:'Venmo' }, { id:'bitcoin', name:'Bitcoin' },
];
const UNAVAILABLE = ['paypal','venmo','bitcoin'];

let current = 'novaclient';
let selected = CATALOG.novaclient.def;
let selectedPay = 'stripe';
let STOCK = null; // { sku: count } from the server; null until loaded

const $ = s => document.querySelector(s);
const fmt = n => '$' + n.toFixed(2);
const prod = () => CATALOG[current];
const opt = id => prod().options.find(o => o.id === id);
const findSku = sku => { for (const k in CATALOG) { const o = CATALOG[k].options.find(x => x.id === sku); if (o) return { p: CATALOG[k], o }; } return null; };
const isSoon = id => { const hit = findSku(id); return !!(hit && hit.p.soon); };
const soldOut = id => isSoon(id) || (STOCK !== null && (STOCK[id] || 0) < 1);
const productSoldOut = key => CATALOG[key].options.every(o => soldOut(o.id));
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>';
const COPY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const CLOSE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>';
const TICK = '<span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m5 13 4 4L19 7"/></svg></span>';

function renderMenu() {
  $('#menu').innerHTML = Object.entries(CATALOG).map(([k, p]) => `
    <button role="tab" data-prod="${k}" aria-selected="${k===current}">
      <img class="thumb" src="${p.thumb || p.img}" alt="">${p.name}${p.soon ? '<span class="so">· Coming soon</span>' : (productSoldOut(k) ? '<span class="so">· Sold out</span>' : '')}
    </button>`).join('');
}

function renderProduct() {
  const p = prod();
  // keep the selection valid for this product; prefer an in-stock option
  if (!opt(selected) || soldOut(selected)) {
    selected = !soldOut(p.def) ? p.def : (p.options.find(o => !soldOut(o.id)) || { id: p.def }).id;
  }
  $('#cover').classList.toggle('photo', p.photo);
  $('#cover').classList.toggle('ui', !!p.ui);
  $('#cover').classList.toggle('square', !!p.square);
  $('#coverImg').src = p.img; $('#coverImg').alt = p.name; $('#coverBg').src = p.photo ? p.img : '';
  $('#coverTag').textContent = p.tag; $('#coverTag').hidden = !p.tag;
  $('#eyebrow').textContent = p.eyebrow;
  $('#title').textContent = p.name;
  $('#blurb').textContent = p.blurb;
  $('#feat').innerHTML = p.feat.map(f => `<li>${TICK}${f}</li>`).join('');
  $('#optsLabel').textContent = p.optsLabel;
  renderMenu();
  renderOpts();
}

function renderOpts() {
  const p = prod();
  $('#opts').innerHTML = p.options.map(o => {
    const out = soldOut(o.id);
    return `
    <button class="opt" data-opt="${o.id}" aria-pressed="${o.id===selected && !out}" ${out?'disabled style="opacity:.55;cursor:not-allowed"':''}>
      <span class="radio"></span>
      <span class="o-main">
        <span class="o-dur">${o.dur}</span>
        ${out ? `<span class="o-badge" style="background:var(--line);color:var(--ink-soft)">${isSoon(o.id) ? 'Coming soon' : 'Sold out'}</span>` : (o.badge?`<span class="o-badge">${o.badge}</span>`:'')}
        <span class="o-sub" style="flex-basis:100%">${o.sub}</span>
      </span>
      <span class="o-price">${isSoon(o.id) ? 'Soon' : fmt(o.price)}</span>
    </button>`;
  }).join('');
  const btn = $('#buyBtn');
  if (soldOut(selected)) { btn.disabled = true; btn.textContent = isSoon(selected) ? 'Coming soon' : 'Sold out'; }
  else { btn.disabled = false; btn.innerHTML = `Get ${p.noun} — <span class="mono">${fmt(opt(selected).price)}</span>`; }
}

const BRAND = { stripe:['#635bff','CARD'], cashapp:['#00d632','$'], paypal:['#003087','P'], venmo:['#008cff','V'], bitcoin:['#f7931a','B'] };
function payIcon(id, w=30, h=22){
  const [bg, lab] = BRAND[id]; const card = id==='stripe';
  return `<svg width="${w}" height="${h}" viewBox="0 0 30 22"><rect width="30" height="22" rx="4" fill="${bg}"/><text x="15" y="${card?15:16}" text-anchor="middle" font-family="${id==='paypal'?'serif':'sans-serif'}" font-size="${card?8:14}" font-weight="700" fill="#fff" ${id==='paypal'?'font-style="italic"':''}>${lab}</text></svg>`;
}
function renderChips(){ $('#chipStrip').innerHTML = PAYMENTS.map(p=>`<span>${payIcon(p.id,30,20)}</span>`).join(''); }

function openModal(html){ $('#modalCard').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }

function noteHtml(id){
  const name = PAYMENTS.find(m=>m.id===id).name;
  const noun = prod().noun;
  if (UNAVAILABLE.includes(id)) return `<b>${name} isn't available at the moment.</b> Please choose another payment method.`;
  return id==='cashapp'
    ? `You'll go to secure checkout to pay with Cash App. Your ${noun} appears here the moment payment clears.`
    : `You'll go to Stripe's secure checkout to pay by card. Your ${noun} appears here the moment payment clears.`;
}
function payBtnLabel(id, price){ return UNAVAILABLE.includes(id) ? `${PAYMENTS.find(m=>m.id===id).name} unavailable` : `Pay ${fmt(price)}`; }

function checkoutView(){
  const p = prod(), o = opt(selected);
  return `
    <div class="modal-head"><h2>Checkout</h2><button class="icon-btn" onclick="closeModal()" aria-label="Close">${CLOSE}</button></div>
    <div class="modal-body">
      <div class="field">
        <label for="buyerEmail">Email for your ${p.noun}</label>
        <input type="email" id="buyerEmail" placeholder="you@email.com" autocomplete="email">
      </div>
      <div class="pay-label">Payment method</div>
      <div class="pays" id="pays">
        ${PAYMENTS.map(m=>`<button class="pay" data-pay="${m.id}" aria-pressed="${m.id===selectedPay}">${payIcon(m.id)}${m.name}</button>`).join('')}
      </div>
      <div class="pay-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div id="payNoteText">${noteHtml(selectedPay)}</div>
      </div>
      <div class="sum-line"><span>${p.name} — ${o.dur}</span><span class="mono">${fmt(o.price)}</span></div>
      <div class="sum-line total"><span>Total</span><span class="mono">${fmt(o.price)}</span></div>
      <button class="btn-primary" id="payBtn" style="margin-top:16px" ${UNAVAILABLE.includes(selectedPay)?'disabled':''}>${payBtnLabel(selectedPay, o.price)}</button>
      <p class="fine">Secure checkout powered by Stripe.</p>
    </div>`;
}

function wireCheckout(){
  $('#pays').querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click',()=>{
    selectedPay=b.dataset.pay;
    $('#pays').querySelectorAll('[data-pay]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pay===selectedPay));
    $('#payNoteText').innerHTML = noteHtml(selectedPay);
    const btn=$('#payBtn'); btn.disabled = UNAVAILABLE.includes(selectedPay); btn.textContent = payBtnLabel(selectedPay, opt(selected).price);
  }));
  $('#payBtn').addEventListener('click', pay);
}

async function pay(){
  if (UNAVAILABLE.includes(selectedPay) || soldOut(selected)) return;
  const email=$('#buyerEmail');
  if (!email.value || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value)) { email.classList.add('err'); email.focus(); return; }
  const btn=$('#payBtn'); btn.disabled=true; btn.textContent='Starting checkout…';
  try {
    const res = await fetch('/api/checkout', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ option: selected, email: email.value, method: selectedPay }) });
    const data = await res.json();
    if (!res.ok || !data.url) throw new Error(data.error || 'Could not start checkout.');
    window.location.href = data.url;
  } catch (err) {
    btn.disabled=false; btn.textContent=payBtnLabel(selectedPay, opt(selected).price);
    $('#payNoteText').innerHTML = `<b style="color:var(--bad)">${err.message}</b>`;
  }
}

function receiptShell(inner){
  return `<div class="modal-head"><h2>Order</h2><button class="icon-btn" onclick="closeReceipt()" aria-label="Close">${CLOSE}</button></div><div class="modal-body">${inner}</div>`;
}

async function showReceipt(sessionId){
  openModal(receiptShell(`<div class="processing"><div class="spinner"></div><p>Confirming your payment…</p></div>`));
  let data=null;
  for (let i=0;i<8;i++){
    try { const r = await fetch('/api/order/'+encodeURIComponent(sessionId)); data = await r.json(); } catch(e){ data=null; }
    if (data && (data.status==='complete' || data.status==='out_of_stock')) break;
    await new Promise(r=>setTimeout(r,1600));
  }
  if (data && data.status==='complete') return renderDelivery(data);
  if (data && data.status==='out_of_stock') {
    return openModal(receiptShell(`<div class="receipt-top"><h2>Payment received</h2><p>We're briefly out of stock. Your order will be emailed to you shortly — reach out if it doesn't arrive.</p></div><button class="btn-ghost" onclick="closeReceipt()">Close</button>`));
  }
  openModal(receiptShell(`<div class="receipt-top"><h2>Still processing</h2><p>Your payment is confirming. Your order will appear here, and a copy is emailed to you.</p></div>
    <button class="btn-primary" onclick="showReceipt('${sessionId}')" style="margin-bottom:10px">Check again</button>
    <button class="btn-ghost" onclick="closeReceipt()">Close</button>`));
}

function renderDelivery(data){
  const hit = findSku(data.duration) || { p: { name:'Nova', noun:'key', redeem:'' }, o: { dur:'Order', sub:'' } };
  const { p, o } = hit;
  openModal(receiptShell(`
    <div class="receipt-top">
      <div class="checkmark">${CHECK.replace('width="16" height="16"','width="28" height="28"')}</div>
      <h2>Payment complete</h2>
      <p>Your ${p.noun} is ready${data.email?`. A copy was sent to ${data.email}`:''}.</p>
    </div>
    <div class="key-item">
      <div class="ki-top"><span class="ki-title">${p.name} — ${o.dur}</span><span class="ki-plat">${o.sub}</span></div>
      <div class="keycode"><code id="theKey">${data.key}</code><button class="copy-key" id="copyKey" aria-label="Copy">${COPY}</button></div>
      <div class="redeem">${p.redeem}</div>
    </div>
    <button class="btn-ghost" onclick="closeReceipt()">Done</button>`));
  $('#copyKey').addEventListener('click', async ()=>{
    const btn=$('#copyKey');
    try { await navigator.clipboard.writeText(data.key); }
    catch(e){ const r=document.createRange(); r.selectNodeContents($('#theKey')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
    btn.classList.add('done'); btn.innerHTML=CHECK;
    setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML=COPY; }, 1600);
  });
}

function closeReceipt(){ closeModal(); history.replaceState(null,'',location.pathname + location.hash); }

function routeFromHash(){
  const h = location.hash.replace('#','');
  current = CATALOG[h] ? h : 'novaclient';
  renderProduct();
}

async function loadStock(){
  try { const r = await fetch('/api/stock'); if (r.ok) { STOCK = await r.json(); renderProduct(); } } catch(e) {}
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-prod]');
  if (t) { location.hash = t.dataset.prod; return; }
  const o = e.target.closest('[data-opt]');
  if (o && !o.disabled) { selected = o.dataset.opt; renderOpts(); }
});
window.addEventListener('hashchange', routeFromHash);
$('#buyBtn').addEventListener('click',()=>{ if (soldOut(selected)) return; openModal(checkoutView()); wireCheckout(); });
$('#modal').addEventListener('click', e=>{ if (e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });

renderChips();
routeFromHash();
loadStock();
window.closeModal = closeModal; window.closeReceipt = closeReceipt; window.showReceipt = showReceipt;
(function(){ const p=new URLSearchParams(location.search); if (p.get('paid') && p.get('session_id')) showReceipt(p.get('session_id')); })();
</script>
</body>
</html>
